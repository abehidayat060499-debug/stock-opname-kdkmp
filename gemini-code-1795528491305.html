<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SO Lapangan Tim — KDKMP</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --accent: #0284c7;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 30px;
    }

    header {
      background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    header h1 { margin: 0; font-size: 1.02rem; }
    header small { display: block; font-size: 0.74rem; color: #99f6e4; }

    .container { max-width: 760px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
    }

    .progress-bar-wrap {
      background: #e2e8f0;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }

    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }

    .input-box {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      background: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: 0.6; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }

    .pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .item-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .item-card.done { border-left: 5px solid var(--success); background: #f0fdf4; }

    .prod-thumb {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #f8fafc;
    }

    .prod-thumb-empty {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      flex-shrink: 0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #94a3b8;
    }

    .sku-pill {
      display: inline-block;
      background: #e2e8f0;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.76rem;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .rack-pill {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      font-size: 0.74rem;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 4px;
    }

    .count-badge {
      min-width: 74px;
      text-align: center;
      padding: 8px 8px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .count-badge.pending { background: #f1f5f9; color: var(--muted); border: 1px dashed #94a3b8; }
    .count-badge.saved { background: var(--success); color: #fff; }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-width: 640px) { .modal-sheet { border-radius: 16px; } }

    .modal-prod-header {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 1;
    }

    .modal-prod-photo {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      background: #f8fafc;
    }

    .num-display {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 2.3rem;
      font-weight: 800;
      text-align: right;
      padding: 10px 16px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .num-btn {
      height: 54px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    .num-btn:active { background: #cbd5e1; }
    .num-btn.op { background: #e0f2fe; color: #0369a1; font-size: 1rem; }
    .num-btn.del { background: #fee2e2; color: #b91c1c; font-size: 1rem; }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; min-height: 230px; }

    .toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 9px 16px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 700; z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="empHeaderTitle">📋 SO Tim — KDKMP Selagedang</h1>
    <small id="cloudBadge">Menghubungkan ke database...</small>
  </div>
  <button class="btn btn-outline" style="padding:7px 11px; font-size:0.8rem;" onclick="loadCloudItems(true)">🔄 Refresh</button>
</header>

<div class="container">

  <div class="card">
    <label style="display:block; font-size:0.78rem; font-weight:700; margin-bottom:4px; color:#334155;">
      👤 Pilih Nama Petugas Penghitung *
    </label>
    <select id="auditorSelect" class="input-box" onchange="handleAuditorChange()">
      <option value="">-- Pilih Nama Anda --</option>
    </select>
    <input type="text" id="auditorCustomInput" class="input-box" placeholder="Ketik nama Anda..." style="margin-top:8px; display:none;" onchange="saveCache()" />

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
      <strong style="font-size:0.85rem;">Progress Gerai: <span id="progressText">0 / 0</span></strong>
      <span style="font-size:0.75rem; color:var(--muted);">Tersimpan otomatis ke Sheets</span>
    </div>
    <div class="progress-bar-wrap">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-accent" style="white-space:nowrap;" onclick="openScanner()">📷 Scan QR</button>
    <input type="text" id="searchBox" class="input-box" placeholder="Cari SKU, nama barang, atau rak..." oninput="renderList()" />
  </div>

  <div class="pills" id="zonePills">
    <button class="pill active" onclick="setZone('ALL', this)">Semua Zona</button>
    <button class="pill" onclick="setZone('Subsidi', this)">Subsidi</button>
    <button class="pill" onclick="setZone('Sembako', this)">Sembako</button>
    <button class="pill" onclick="setZone('Pertanian', this)">Pertanian</button>
    <button class="pill" onclick="setZone('Lainnya', this)">Lainnya</button>
  </div>

  <div class="pills" id="statusPills">
    <button class="pill active" onclick="setStatus('ALL', this)">Semua Status</button>
    <button class="pill" onclick="setStatus('UNCOUNTED', this)">Belum Dihitung</button>
    <button class="pill" onclick="setStatus('COUNTED', this)">Sudah Dihitung</button>
  </div>

  <div id="itemList"></div>

</div>

<!-- POPUP NUMPAD MODAL DENGAN FOTO PRODUK BESAR -->
<div id="numpadModal" class="modal-backdrop">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
      <div class="modal-prod-header">
        <img id="mItemPhoto" src="" alt="Foto Produk" class="modal-prod-photo" style="display:none;" />
        <div>
          <span id="mSkuTag" class="sku-pill">SKU</span>
          <span id="mRackTag" class="rack-pill">Rak</span>
          <h3 id="mItemName" style="margin:6px 0 2px; font-size:1.05rem;">Nama Barang</h3>
          <small id="mItemUnit" style="color:var(--muted); font-weight:700;">Satuan: Pcs</small>
        </div>
      </div>
      <button class="btn btn-outline" style="padding:6px 12px;" onclick="closeNumpad()">✕</button>
    </div>

    <div class="num-display" id="numDisplay">0</div>

    <div class="numpad-grid">
      <button class="num-btn" onclick="tapNum('7')">7</button>
      <button class="num-btn" onclick="tapNum('8')">8</button>
      <button class="num-btn" onclick="tapNum('9')">9</button>
      <button class="num-btn del" onclick="tapBack()">⌫</button>

      <button class="num-btn" onclick="tapNum('4')">4</button>
      <button class="num-btn" onclick="tapNum('5')">5</button>
      <button class="num-btn" onclick="tapNum('6')">6</button>
      <button class="num-btn del" onclick="tapClear()">C</button>

      <button class="num-btn" onclick="tapNum('1')">1</button>
      <button class="num-btn" onclick="tapNum('2')">2</button>
      <button class="num-btn" onclick="tapNum('3')">3</button>
      <button class="num-btn op" onclick="tapAdd(1)">+1</button>

      <button class="num-btn" onclick="tapNum('0')">0</button>
      <button class="num-btn" onclick="tapNum('00')">00</button>
      <button class="num-btn op" onclick="tapAdd(5)">+5</button>
      <button class="num-btn op" onclick="tapAdd(10)">+10</button>
    </div>

    <input type="text" id="mNoteInput" placeholder="Catatan fisik (opsional, misal: 1 kemasan bocor)..." class="input-box" style="margin-bottom:10px;" />

    <button id="saveCountBtn" class="btn btn-primary" style="width:100%; height:50px; font-size:1rem;" onclick="confirmCount()">
      ✅ SIMPAN KE DATABASE
    </button>
  </div>
</div>

<!-- SCANNER MODAL -->
<div id="scanModal" class="modal-backdrop">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">📷 Scan QR Rak / Barcode</h3>
      <button class="btn btn-outline" style="padding:6px 12px;" onclick="closeScanner()">✕ Tutup</button>
    </div>
    <div id="reader"></div>
    <p id="scanStatus" style="font-size:0.82rem; color:var(--muted); text-align:center; margin-top:8px;">
      Arahkan kamera ke label QR rak...
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
  const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxABcWnvWaUzGPmLCmOvOABs8WwCbhN73rlCxEbgtA35WzH1a-c8EL5Cfg0xR8Cs0ye/exec';
  const EMP_CACHE_KEY = 'kdkmp_emp_cloud_cache_v2';

  let scriptUrl = '';
  let publicConfig = {
    kdkmpName: 'KDKMP Selagedang',
    kdkmpRegion: '',
    managerName: 'Abdurrahman',
    employees: []
  };
  let itemsList = [];
  let zoneFilter = 'ALL';
  let statusFilter = 'ALL';
  let activeSku = null;
  let numBuffer = '0';
  let qrScanner = null;

  function initEmp() {
    const params = new URLSearchParams(window.location.search);
    const apiParam = params.get('api');
    const cached = JSON.parse(localStorage.getItem(EMP_CACHE_KEY) || '{}');

    if (apiParam) {
      scriptUrl = apiParam;
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (cached.scriptUrl) {
      scriptUrl = cached.scriptUrl;
    } else if (DEFAULT_SCRIPT_URL !== 'PASTE_URL_WEB_APP_ANDA_DI_SINI') {
      scriptUrl = DEFAULT_SCRIPT_URL;
    }

    publicConfig = cached.publicConfig || publicConfig;
    itemsList = cached.items || [];
    applyEmpConfigUI(cached.selectedAuditor || '', cached.customAuditor || '');
    renderList();

    if (scriptUrl) {
      loadCloudItems(false);
    } else {
      document.getElementById('cloudBadge').textContent = '⚠️ URL Database belum diatur';
    }
  }

  function applyEmpConfigUI(savedSelect, savedCustom) {
    document.title = `SO Tim — ${publicConfig.kdkmpName}`;
    document.getElementById('empHeaderTitle').textContent = `📋 SO Tim — ${publicConfig.kdkmpName}`;

    const sel = document.getElementById('auditorSelect');
    const currentVal = savedSelect || sel.value;
    sel.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';

    (publicConfig.employees || []).forEach(emp => {
      const opt = document.createElement('option');
      opt.value = emp;
      opt.textContent = emp;
      sel.appendChild(opt);
    });

    const otherOpt = document.createElement('option');
    otherOpt.value = '__OTHER__';
    otherOpt.textContent = '+ Nama Lainnya...';
    sel.appendChild(otherOpt);

    if (currentVal) sel.value = currentVal;
    if (savedCustom) document.getElementById('auditorCustomInput').value = savedCustom;
    handleAuditorChange(true);
  }

  function handleAuditorChange(skipSave = false) {
    const val = document.getElementById('auditorSelect').value;
    const customBox = document.getElementById('auditorCustomInput');
    customBox.style.display = (val === '__OTHER__') ? 'block' : 'none';
    if (!skipSave) saveCache();
  }

  function getActiveAuditorName() {
    const sel = document.getElementById('auditorSelect').value;
    if (sel === '__OTHER__') {
      return document.getElementById('auditorCustomInput').value.trim();
    }
    return sel.trim();
  }

  function saveCache() {
    localStorage.setItem(EMP_CACHE_KEY, JSON.stringify({
      scriptUrl,
      publicConfig,
      selectedAuditor: document.getElementById('auditorSelect').value,
      customAuditor: document.getElementById('auditorCustomInput').value.trim(),
      items: itemsList
    }));
  }

  async function loadCloudItems(notify = false) {
    if (!scriptUrl) return;
    const badge = document.getElementById('cloudBadge');
    badge.textContent = '⏳ Memuat daftar barang...';

    try {
      const res = await fetch(`${scriptUrl}?action=get_items&role=karyawan`);
      const json = await res.json();
      if (json.ok) {
        if (json.config) {
          publicConfig = json.config;
          applyEmpConfigUI();
        }
        itemsList = json.items || [];
        saveCache();
        renderList();
        badge.textContent = `🟢 Terhubung (${itemsList.length} SKU)`;
        if (notify) showToast('🔄 Daftar barang & profil diperbarui');
      } else {
        badge.textContent = '🔴 Gagal memuat data';
      }
    } catch (e) {
      badge.textContent = '🟡 Mode Offline (Data Cache)';
      if (notify) showToast('⚠️ Tidak ada koneksi internet');
    }
  }

  function setZone(z, btn) {
    zoneFilter = z;
    document.querySelectorAll('#zonePills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  function setStatus(s, btn) {
    statusFilter = s;
    document.querySelectorAll('#statusPills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  function renderList() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    const listEl = document.getElementById('itemList');
    listEl.innerHTML = '';

    const total = itemsList.length;
    const counted = itemsList.filter(i => i.physStock !== null && i.physStock !== undefined).length;
    document.getElementById('progressText').textContent = `${counted} / ${total} Barang`;
    document.getElementById('progressBar').style.width = total ? `${Math.round((counted / total) * 100)}%` : '0%';

    const filtered = itemsList.filter(item => {
      if (zoneFilter !== 'ALL' && item.zone !== zoneFilter) return false;
      const done = item.physStock !== null && item.physStock !== undefined;
      if (statusFilter === 'UNCOUNTED' && done) return false;
      if (statusFilter === 'COUNTED' && !done) return false;
      if (q) {
        const hay = `${item.sku} ${item.barcode} ${item.name} ${item.rack}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Tidak ada barang yang sesuai filter.</div>`;
      return;
    }

    filtered.forEach(item => {
      const done = item.physStock !== null && item.physStock !== undefined;
      const div = document.createElement('div');
      div.className = 'item-card' + (done ? ' done' : '');
      div.onclick = () => openNumpad(item.sku);

      const photoHtml = item.photo
        ? `<img src="${escapeHtml(item.photo)}" class="prod-thumb" alt="${escapeHtml(item.name)}" />`
        : `<div class="prod-thumb-empty">📦</div>`;

      div.innerHTML = `
        ${photoHtml}
        <div style="flex:1; min-width:0;">
          <div>
            <span class="sku-pill">${escapeHtml(item.sku)}</span>
            <span class="rack-pill">${escapeHtml(item.rack)}</span>
          </div>
          <div style="font-weight:800; font-size:0.95rem; margin-top:3px;">${escapeHtml(item.name)}</div>
          <div style="font-size:0.75rem; color:var(--muted);">
            Satuan: ${escapeHtml(item.unit)}
            ${done && item.auditor ? `• Oleh: <b>${escapeHtml(item.auditor)}</b>` : ''}
          </div>
        </div>
        <div class="count-badge ${done ? 'saved' : 'pending'}">
          ${done ? `${item.physStock}<br/><span style="font-size:0.68rem; font-weight:600;">${escapeHtml(item.unit)}</span>` : 'Hitung'}
        </div>
      `;
      listEl.appendChild(div);
    });
  }

  function openNumpad(sku) {
    const auditor = getActiveAuditorName();
    if (!auditor) {
      alert('Pilih atau isi Nama Petugas Penghitung di bagian atas terlebih dahulu.');
      document.getElementById('auditorSelect').focus();
      return;
    }

    const item = itemsList.find(i => i.sku === sku);
    if (!item) return;
    activeSku = sku;

    document.getElementById('mSkuTag').textContent = item.sku;
    document.getElementById('mRackTag').textContent = item.rack;
    document.getElementById('mItemName').textContent = item.name;
    document.getElementById('mItemUnit').textContent = `Satuan Hitung: ${item.unit}`;
    document.getElementById('mNoteInput').value = item.note || '';

    const photoEl = document.getElementById('mItemPhoto');
    if (item.photo) {
      photoEl.src = item.photo;
      photoEl.style.display = 'block';
    } else {
      photoEl.src = '';
      photoEl.style.display = 'none';
    }

    const hasVal = item.physStock !== null && item.physStock !== undefined;
    numBuffer = hasVal ? String(item.physStock) : '0';
    document.getElementById('numDisplay').textContent = numBuffer;

    document.getElementById('numpadModal').classList.add('open');
  }

  function closeNumpad() {
    document.getElementById('numpadModal').classList.remove('open');
    activeSku = null;
  }

  function tapNum(d) {
    if (numBuffer === '0') numBuffer = (d === '00' ? '0' : d);
    else if (numBuffer.length < 6) numBuffer += d;
    document.getElementById('numDisplay').textContent = numBuffer;
  }

  function tapBack() {
    numBuffer = numBuffer.length <= 1 ? '0' : numBuffer.slice(0, -1);
    document.getElementById('numDisplay').textContent = numBuffer;
  }

  function tapClear() {
    numBuffer = '0';
    document.getElementById('numDisplay').textContent = '0';
  }

  function tapAdd(n) {
    numBuffer = String((parseInt(numBuffer || '0', 10)) + n);
    document.getElementById('numDisplay').textContent = numBuffer;
  }

  async function confirmCount() {
    const item = itemsList.find(i => i.sku === activeSku);
    if (!item) return;

    const auditor = getActiveAuditorName() || 'Tim SO';
    const physStock = parseInt(numBuffer || '0', 10) || 0;
    const note = document.getElementById('mNoteInput').value.trim();

    const btn = document.getElementById('saveCountBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Mengirim ke Sheets...';

    try {
      const res = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit_count',
          sku: item.sku,
          physStock,
          auditor,
          note
        })
      });
      const json = await res.json();

      if (json.ok) {
        item.physStock = physStock;
        item.auditor = auditor;
        item.note = note;
        saveCache();
        playBeep();
        closeNumpad();
        renderList();
        showToast(`✅ Tersimpan: ${item.name} = ${physStock} ${item.unit}`);
      } else {
        alert('Gagal menyimpan ke server: ' + (json.error || 'Error'));
      }
    } catch (err) {
      alert('Koneksi terputus saat mengirim data. Periksa sinyal internet Anda lalu tekan Simpan lagi.');
    } finally {
      btn.disabled = false;
      btn.textContent = '✅ SIMPAN KE DATABASE';
    }
  }

  function openScanner() {
    const auditor = getActiveAuditorName();
    if (!auditor) {
      alert('Pilih atau isi Nama Petugas Penghitung terlebih dahulu.');
      document.getElementById('auditorSelect').focus();
      return;
    }

    document.getElementById('scanModal').classList.add('open');
    if (typeof Html5Qrcode === 'undefined') {
      document.getElementById('scanStatus').textContent = '⚠️ Library scanner belum termuat.';
      return;
    }
    qrScanner = new Html5Qrcode("reader");
    qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (code) => {
        playBeep();
        closeScanner();
        const found = itemsList.find(i =>
          i.sku.toLowerCase() === code.trim().toLowerCase() ||
          (i.barcode && i.barcode.toLowerCase() === code.trim().toLowerCase())
        );
        if (found) {
          openNumpad(found.sku);
        } else {
          showToast(`⚠️ Kode "${code}" belum terdaftar di Master`);
        }
      },
      () => {}
    ).catch(() => {
      document.getElementById('scanStatus').textContent = '❌ Pastikan dibuka lewat HTTPS dan izin kamera aktif.';
    });
  }

  function closeScanner() {
    document.getElementById('scanModal').classList.remove('open');
    if (qrScanner) {
      qrScanner.stop().then(() => qrScanner.clear()).catch(() => {});
      qrScanner = null;
    }
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2300);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.addEventListener('DOMContentLoaded', initEmp);
</script>
</body>
</html>
