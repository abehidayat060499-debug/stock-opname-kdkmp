<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stock Opname Tim — KDKMP</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #0284c7;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --info-bg: #e0f2fe;
      --info-text: #0369a1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 30px;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    header h1 { margin: 0; font-size: 1.05rem; }
    header small { display: block; font-size: 0.75rem; color: #99f6e4; }

    .container { max-width: 680px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .label-title {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
    .btn-sm { padding: 7px 11px; font-size: 0.8rem; }

    .filter-pills {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
    }

    .pill-btn {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .item-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .item-card:active { transform: scale(0.99); }
    .item-card.counted-mine { border-color: #86efac; background: #f0fdf4; }
    .item-card.counted-other { border-color: #bae6fd; background: #f8fafc; }

    .item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .item-thumb-empty {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: #f1f5f9;
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .sku-pill {
      font-family: monospace;
      font-size: 0.76rem;
      font-weight: 700;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .status-tag {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .tag-pending { background: #fef3c7; color: #b45309; }
    .tag-mine { background: var(--success-bg); color: var(--success); }
    .tag-other { background: var(--info-bg); color: var(--info-text); }

    /* MODAL INPUT NUMPAD */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .sheet-modal {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 20px 20px 0 0;
      padding: 18px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .other-notice {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      color: #1e40af;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 0.8rem;
      margin: 10px 0;
    }

    .qty-display {
      width: 100%;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      padding: 10px;
      border: 2px solid var(--primary);
      border-radius: 12px;
      background: #f0fdfa;
      color: #0f172a;
      margin: 10px 0;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .num-key {
      padding: 14px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      touch-action: manipulation;
    }
    .num-key:active { background: #e2e8f0; }

    #qrReaderBox {
      display: none;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="headerTitle">📋 Stock Opname — KDKMP Selagedang</h1>
    <small id="headerSub">Menghubungkan ke database...</small>
  </div>
  <button id="refreshBtn" class="btn btn-accent btn-sm" onclick="loadCloudItems(true)">🔄 Refresh</button>
</header>

<div class="container">
  <!-- PILIH NAMA PETUGAS (HANYA DARI DAFTAR MANAGER) -->
  <div class="card">
    <label class="label-title" for="auditorSelect">👤 Pilih Nama Petugas Pelaksana *</label>
    <select id="auditorSelect" onchange="onAuditorChange()">
      <option value="">-- Memuat daftar nama tim... --</option>
    </select>
    <small style="display:block; color:var(--muted); margin-top:6px;">
      Pilih nama Anda terlebih dahulu sebelum mulai memindai atau menghitung barang.
    </small>
  </div>

  <!-- PENCARIAN & SCANNER QR -->
  <div class="card">
    <div style="display:flex; gap:8px;">
      <input type="text" id="searchInput" placeholder="Cari nama barang, SKU, atau rak..." oninput="renderItemsList()" />
      <button id="scanBtn" class="btn btn-primary" style="flex-shrink:0;" onclick="toggleScanner()">📷 Scan QR</button>
    </div>

    <div id="qrReaderBox">
      <div id="qrReader" style="width:100%;"></div>
      <button class="btn btn-outline" style="width:100%; border-radius:0;" onclick="stopScanner()">Tutup Kamera</button>
    </div>

    <div class="filter-pills">
      <button class="pill-btn active" onclick="setFilterMode('ALL', this)">Semua (<span id="cntAll">0</span>)</button>
      <button class="pill-btn" onclick="setFilterMode('UNCOUNTED', this)">Belum Dihitung (<span id="cntPending">0</span>)</button>
      <button class="pill-btn" onclick="setFilterMode('MINE', this)">Hitungan Saya (<span id="cntMine">0</span>)</button>
    </div>
  </div>

  <!-- DAFTAR BARANG -->
  <div id="itemsContainer"></div>
</div>

<!-- MODAL HITUNG FISIK -->
<div id="countModal" class="modal-backdrop">
  <div class="sheet-modal">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div>
        <span id="modalSku" class="sku-pill">SKU</span>
        <span id="modalRack" style="font-size:0.8rem; font-weight:700; color:var(--accent); margin-left:4px;">Rak</span>
        <h3 id="modalName" style="margin:6px 0 2px;">Nama Barang</h3>
        <small id="modalUnit" style="color:var(--muted);">Satuan</small>
      </div>
      <button class="btn btn-outline btn-sm" onclick="closeCountModal()">✕</button>
    </div>

    <div id="otherAuditorAlert" class="other-notice" style="display:none;"></div>

    <input type="text" id="qtyInput" class="qty-display" readonly value="0" />

    <div class="numpad-grid">
      <button type="button" class="num-key" onclick="pressNum('1')">1</button>
      <button type="button" class="num-key" onclick="pressNum('2')">2</button>
      <button type="button" class="num-key" onclick="pressNum('3')">3</button>
      <button type="button" class="num-key" onclick="pressNum('4')">4</button>
      <button type="button" class="num-key" onclick="pressNum('5')">5</button>
      <button type="button" class="num-key" onclick="pressNum('6')">6</button>
      <button type="button" class="num-key" onclick="pressNum('7')">7</button>
      <button type="button" class="num-key" onclick="pressNum('8')">8</button>
      <button type="button" class="num-key" onclick="pressNum('9')">9</button>
      <button type="button" class="num-key" style="background:#fee2e2; color:#dc2626;" onclick="clearNum()">C</button>
      <button type="button" class="num-key" onclick="pressNum('0')">0</button>
      <button type="button" class="num-key" onclick="backspaceNum()">⌫</button>
    </div>

    <input type="text" id="noteInput" placeholder="Catatan kondisi barang (opsional, misal: 1 kemasan rusak)" style="margin-bottom:12px;" />

    <button id="submitCountBtn" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem;" onclick="submitItemCount()">
      💾 Simpan Hasil Hitung Fisik
    </button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxABcWnvWaUzGPmLCmOvOABs8WwCbhN73rlCxEbgtA35WzH1a-c8EL5Cfg0xR8Cs0ye/exec';
  const EMP_CACHE_KEY = 'kdkmp_emp_cloud_cache_v3';

  let scriptUrl = '';
  let appConfig = {
    kdkmpName: 'KDKMP Selagedang',
    kdkmpRegion: 'Kec. Cibeber, Kab. Cianjur',
    employees: []
  };
  let itemsList = [];
  let filterMode = 'ALL';
  let activeItem = null;
  let html5QrScanner = null;

  function init() {
    const params = new URLSearchParams(window.location.search);
    scriptUrl = params.get('api') || DEFAULT_SCRIPT_URL;

    // Muat cache daftar barang agar tampilan muncul instan saat membuka link
    const cached = JSON.parse(localStorage.getItem(EMP_CACHE_KEY) || 'null');
    if (cached && cached.items) {
      appConfig = cached.config || appConfig;
      itemsList = cached.items || [];
      populateEmployeeDropdown();
      renderItemsList();
    }

    loadCloudItems(false);
  }

  function populateEmployeeDropdown() {
    const sel = document.getElementById('auditorSelect');
    const currentSelected = sel.value;
    const employees = appConfig.employees || [];

    if (employees.length === 0) {
      sel.innerHTML = '<option value="">-- Belum ada nama terdaftar (Hubungi Manager) --</option>';
      return;
    }

    sel.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
    employees.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });

    if (currentSelected && employees.includes(currentSelected)) {
      sel.value = currentSelected;
    }
  }

  function onAuditorChange() {
    renderItemsList();
  }

  async function loadCloudItems(notify = false) {
    const subEl = document.getElementById('headerSub');
    const refBtn = document.getElementById('refreshBtn');
    subEl.textContent = 'Menyinkronkan data...';
    if (refBtn) refBtn.disabled = true;

    try {
      const res = await fetch(`${scriptUrl}?action=get_items&role=employee`);
      const json = await res.json();
      if (json.ok) {
        appConfig = json.config || appConfig;
        itemsList = json.items || [];
        try {
          localStorage.setItem(EMP_CACHE_KEY, JSON.stringify({ config: appConfig, items: itemsList }));
        } catch (e) {}

        document.title = `Stock Opname — ${appConfig.kdkmpName}`;
        document.getElementById('headerTitle').textContent = `📋 Stock Opname — ${appConfig.kdkmpName}`;
        subEl.textContent = `🟢 Terhubung • ${appConfig.kdkmpRegion || ''}`;
        populateEmployeeDropdown();
        renderItemsList();
        if (notify) showToast('🔄 Data terbaru dimuat');
      } else {
        subEl.textContent = '🔴 Gagal memuat data';
      }
    } catch (err) {
      subEl.textContent = '🟡 Mode Offline (Cek Koneksi)';
      if (notify) showToast('⚠️ Gagal terhubung ke server');
    } finally {
      if (refBtn) refBtn.disabled = false;
    }
  }

  function setFilterMode(mode, btn) {
    filterMode = mode;
    document.querySelectorAll('.pill-btn').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    renderItemsList();
  }

  function renderItemsList() {
    const selectedAuditor = document.getElementById('auditorSelect').value.trim();
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const box = document.getElementById('itemsContainer');
    box.innerHTML = '';

    let pendingCount = 0;
    let mineCount = 0;

    itemsList.forEach(item => {
      const hasPhys = item.physStock !== null && item.physStock !== undefined;
      if (!hasPhys) {
        pendingCount++;
      } else if (selectedAuditor && item.auditor === selectedAuditor) {
        mineCount++;
      }
    });

    document.getElementById('cntAll').textContent = itemsList.length;
    document.getElementById('cntPending').textContent = pendingCount;
    document.getElementById('cntMine').textContent = mineCount;

    const filtered = itemsList.filter(item => {
      const hasPhys = item.physStock !== null && item.physStock !== undefined;
      const isMine = hasPhys && selectedAuditor && item.auditor === selectedAuditor;

      if (filterMode === 'UNCOUNTED' && hasPhys) return false;
      if (filterMode === 'MINE' && !isMine) return false;

      if (q) {
        const hay = `${item.sku} ${item.barcode} ${item.name} ${item.rack} ${item.zone}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      box.innerHTML = '<div class="card" style="text-align:center; color:var(--muted);">Tidak ada barang pada filter ini.</div>';
      return;
    }

    filtered.forEach(item => {
      const hasPhys = item.physStock !== null && item.physStock !== undefined;
      const isMine = hasPhys && selectedAuditor && item.auditor === selectedAuditor;
      const isOther = hasPhys && !isMine;

      let cardClass = 'item-card';
      let statusHtml = '<span class="status-tag tag-pending">⏳ Belum Dihitung</span>';

      if (isMine) {
        cardClass += ' counted-mine';
        statusHtml = `<span class="status-tag tag-mine">✅ Hitungan Anda: ${item.physStock} ${escapeHtml(item.unit)}</span>`;
      } else if (isOther) {
        cardClass += ' counted-other';
        statusHtml = `<span class="status-tag tag-other">🔒 Sudah dihitung oleh ${escapeHtml(item.auditor || 'Petugas lain')}</span>`;
      }

      const thumbHtml = item.photo
        ? `<img src="${escapeHtml(item.photo)}" class="item-thumb" alt="Foto" />`
        : `<div class="item-thumb-empty">📦</div>`;

      const div = document.createElement('div');
      div.className = cardClass;
      div.onclick = () => openCountModal(item.sku);
      div.innerHTML = `
        ${thumbHtml}
        <div style="flex:1; min-width:0;">
          <div>
            <span class="sku-pill">${escapeHtml(item.sku)}</span>
            <span style="font-size:0.78rem; font-weight:700; color:var(--accent); margin-left:4px;">${escapeHtml(item.rack || '-')}</span>
          </div>
          <div style="font-weight:700; font-size:0.95rem; margin-top:3px;">${escapeHtml(item.name)}</div>
          <div style="font-size:0.78rem; color:var(--muted);">${escapeHtml(item.zone)} • Satuan: ${escapeHtml(item.unit)}</div>
          ${statusHtml}
        </div>
      `;
      box.appendChild(div);
    });
  }

  function openCountModal(sku) {
    const auditor = document.getElementById('auditorSelect').value.trim();
    if (!auditor) {
      alert('Pilih nama Anda terlebih dahulu pada kotak Pilihan Nama Petugas di bagian atas!');
      document.getElementById('auditorSelect').focus();
      return;
    }

    const item = itemsList.find(x => x.sku === sku);
    if (!item) return;
    activeItem = item;

    const hasPhys = item.physStock !== null && item.physStock !== undefined;
    const isMine = hasPhys && item.auditor === auditor;
    const isOther = hasPhys && !isMine;

    document.getElementById('modalSku').textContent = item.sku;
    document.getElementById('modalRack').textContent = item.rack || '-';
    document.getElementById('modalName').textContent = item.name;
    document.getElementById('modalUnit').textContent = `Zona: ${item.zone} • Satuan: ${item.unit}`;

    const alertBox = document.getElementById('otherAuditorAlert');
    if (isOther) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = `ℹ️ Barang ini sudah dihitung sebelumnya oleh <b>${escapeHtml(item.auditor)}</b>. Input angka di bawah hanya jika Anda ditugaskan menghitung ulang.`;
      // Mulai dari 0 agar tidak terbawa angka input milik karyawan lain
      document.getElementById('qtyInput').value = '0';
      document.getElementById('noteInput').value = '';
    } else if (isMine) {
      alertBox.style.display = 'none';
      document.getElementById('qtyInput').value = String(item.physStock);
      document.getElementById('noteInput').value = item.note || '';
    } else {
      alertBox.style.display = 'none';
      document.getElementById('qtyInput').value = '0';
      document.getElementById('noteInput').value = '';
    }

    document.getElementById('countModal').classList.add('open');
  }

  function closeCountModal() {
    document.getElementById('countModal').classList.remove('open');
    activeItem = null;
  }

  function pressNum(digit) {
    const el = document.getElementById('qtyInput');
    el.value = el.value === '0' ? digit : (el.value + digit).slice(0, 6);
  }

  function clearNum() {
    document.getElementById('qtyInput').value = '0';
  }

  function backspaceNum() {
    const el = document.getElementById('qtyInput');
    el.value = el.value.length <= 1 ? '0' : el.value.slice(0, -1);
  }

  async function submitItemCount() {
    if (!activeItem) return;
    const auditor = document.getElementById('auditorSelect').value.trim();
    if (!auditor) {
      alert('Pilih nama petugas terlebih dahulu.');
      return;
    }

    const physStock = parseInt(document.getElementById('qtyInput').value || '0', 10);
    const note = document.getElementById('noteInput').value.trim();
    const btn = document.getElementById('submitCountBtn');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    try {
      const res = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit_count',
          sku: activeItem.sku,
          physStock,
          auditor,
          note
        })
      });
      const json = await res.json();
      if (json.ok) {
        if (Array.isArray(json.items)) {
          itemsList = json.items;
          try {
            localStorage.setItem(EMP_CACHE_KEY, JSON.stringify({ config: appConfig, items: itemsList }));
          } catch (e) {}
        }
        renderItemsList();
        closeCountModal();
        showToast(`✅ Tersimpan (${physStock} ${activeItem.unit})`);
      } else {
        alert('Gagal menyimpan: ' + (json.error || 'Error'));
      }
    } catch (err) {
      alert('Koneksi terputus saat menyimpan. Periksa jaringan internet lalu coba lagi.');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Simpan Hasil Hitung Fisik';
    }
  }

  // SCANNER QR / BARCODE
  function toggleScanner() {
    const box = document.getElementById('qrReaderBox');
    if (box.style.display === 'block') {
      stopScanner();
      return;
    }
    const auditor = document.getElementById('auditorSelect').value.trim();
    if (!auditor) {
      alert('Pilih nama Anda terlebih dahulu sebelum memindai QR!');
      return;
    }

    box.style.display = 'block';
    html5QrScanner = new Html5Qrcode('qrReader');
    html5QrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        const code = decodedText.trim().toUpperCase();
        const found = itemsList.find(i => i.sku.toUpperCase() === code || (i.barcode && i.barcode.toUpperCase() === code));
        if (found) {
          stopScanner();
          openCountModal(found.sku);
        } else {
          showToast(`⚠️ Kode ${code} tidak terdaftar`);
        }
      },
      () => {}
    ).catch(() => {
      alert('Kamera tidak dapat diakses. Pastikan izin kamera diizinkan pada browser.');
      box.style.display = 'none';
    });
  }

  function stopScanner() {
    const box = document.getElementById('qrReaderBox');
    box.style.display = 'none';
    if (html5QrScanner) {
      html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {});
      html5QrScanner = null;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
